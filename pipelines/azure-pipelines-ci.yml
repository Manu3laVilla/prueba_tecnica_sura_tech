# CI — pull requests
trigger: none

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Validate
    jobs:
      - job: Java
        steps:
          - task: Maven@4
            inputs:
              mavenPomFile: practical/pom.xml
              goals: test
              jdkVersionOption: "1.21"
            displayName: Maven test (payments-intake)

      - job: Terraform
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: "1.9.0"
          - script: |
              cd infra
              terraform init -backend=false
              terraform validate
            displayName: terraform validate

      - job: Security
        steps:
          - script: |
              echo "Dependency scan placeholder — integrate Mend/OWASP per org standard"
            displayName: Security gates (documented)